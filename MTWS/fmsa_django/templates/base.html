<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}基于航班计划的气象监视告警系统 · FMSA{% endblock %}</title>
  {% load static %}
  <link rel="icon" type="image/svg+xml" href="{% static 'svg/fmsa-favicon.svg' %}" id="fmsa-favicon">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_css %}{% endblock %}
</head>

<body>
  <script>
    (function () {
      function migrate(storage) {
        var keys = [];
        var i;
        for (i = 0; i < storage.length; i++) keys.push(storage.key(i));
        keys.forEach(function (key) {
          if (!key || key.indexOf('mtws_') !== 0) return;
          var next = 'fmsa_' + key.slice(5);
          if (storage.getItem(next) == null) storage.setItem(next, storage.getItem(key));
          if (key !== 'mtws_token' && key !== 'mtws_userCode') storage.removeItem(key);
        });
      }
      try { migrate(window.localStorage); migrate(window.sessionStorage); } catch (e) {}
    })();
  </script>
  <script>
    (function () {
      var raw = '{{ alert_colors_json|default:""|escapejs }}';
      var colors = null;
      try { colors = raw ? JSON.parse(raw) : null; } catch (e) { colors = null; }
      window.FMSA_ALERT_COLORS = colors;
      if (!colors) return;
      var root = document.documentElement;
      ['R', 'Y', 'G', 'N'].forEach(function (k) {
        var c = colors[k];
        if (!c) return;
        var key = k.toLowerCase();
        if (c.hex) root.style.setProperty('--alert-' + key, c.hex);
        if (c.rgb) root.style.setProperty('--alert-' + key + '-rgb', c.rgb);
      });
    })();
  </script>
  {% block content %}{% endblock %}

  <script src="{% static 'js/echarts.min.js' %}"></script>
  <script src="{% static 'js/access.js' %}"></script>
  <script src="{% static 'js/main_metar.js' %}"></script>
  <script src="{% static 'js/main_taf.js' %}"></script>
  <script src="{% static 'js/main_flight.js' %}"></script>
  <script src="{% static 'js/main.js' %}"></script>
  <script src="{% static 'js/settings.js' %}"></script>
  <script src="{% static 'js/trend_settings.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>

</html>
